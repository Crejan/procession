[package]
name = "p-age"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "The broker of the approval system: checks that a request may be asked, carries it to the person's machine and back, registers delegations"
license = "MIT OR Apache-2.0"
keywords = ["approval", "broker", "agent", "delegation"]
categories = ["command-line-utilities", "authentication"]
include = ["src/**", "SPEC.md"]
publish = false

[lib]
name = "p_age"
path = "src/lib.rs"

[[bin]]
name = "page"
path = "src/main.rs"

[dependencies]
p-act = { path = "../p-act" }
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
base64 = "0.23"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
