[package]
name = "p-age"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "The broker of the approval system: checks that a request may be asked, carries it to the person's machine and back, registers delegations"
license = "MIT OR Apache-2.0"
keywords = ["approval", "broker", "agent", "delegation"]
categories = ["command-line-utilities", "authentication"]
include = ["src/**", "SPEC.md"]
publish = false

[lib]
name = "p_age"
path = "src/lib.rs"

[[bin]]
name = "page"
path = "src/main.rs"

[features]
# What another crate's tests need to stand up a broker in-process (`p_age::testing`): a site file builder, a broker
# over it, a TLS root and server certificate. Not in a normal build.
test-support = ["dep:rcgen"]

[dependencies]
p-act = { path = "../p-act" }
p-ermit = { path = "../p-ermit" }
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }

[dev-dependencies]
base64 = "0.23"
# The tests use the test support, and the TLS 1.2 client that the refusal test needs (a feature that a normal build
# does not switch on: the broker's TLS 1.3 restriction is in code and does not rest on its absence).
p-age = { path = ".", features = ["test-support"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
