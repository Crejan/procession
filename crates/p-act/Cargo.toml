[package]
name = "p-act"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "The formats the approval system's programs share: call, request, approval, clearance, rating, and their signatures"
license = "MIT OR Apache-2.0"
keywords = ["ssh", "approval", "sshsig"]
categories = ["authentication"]
include = ["src/**"]
publish = false

[features]
# Everything but `peer`: the signed formats, the exchange, the signatures. On by default, so a crate that depends on
# `p-act` as before gets what it had; a crate that wants only `p_act::peer` (who is on the other end of a Unix
# socket) says `default-features = false` and has `libc` and nothing else.
default = ["formats"]
formats = ["dep:base64", "dep:serde", "dep:serde_json", "dep:ring", "dep:tempfile", "dep:thiserror"]
# The agent-side signer `pact` (proposals/pact.md): the library the binary is made of, and the binary.
pact = ["formats", "dep:ureq"]
# For tests only, never for a release: turns on `serde_json`'s `preserve_order` for the whole build, which any crate
# of a workspace can do to everyone. `cargo test -p p-act --features guard-preserve-order` fails if anything in `p-act`
# depends on the order of a JSON map (see the report on member order).
guard-preserve-order = ["formats", "serde_json/preserve_order"]
# TOML settings files (`p_act::settings::read_toml`): `toml` 0.9 and `serde`, and nothing of `formats`. Off by default.
toml = ["dep:toml", "dep:serde"]
# TLS for `pact`'s HTTP client (stage 2). Without it `pact` speaks plain http only.
pact-tls = ["pact", "ureq/rustls", "dep:rustls"]

[[bin]]
name = "pact"
path = "src/bin/pact.rs"
required-features = ["pact"]

[dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, optional = true }
# Only to recognise a refused certificate in an error of the TLS handshake (feature pact-tls).
rustls = { version = "0.23", default-features = false, optional = true }
base64 = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
ring = { version = "0.17", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"], optional = true }

[[test]]
name = "ssh"
path = "tests/ssh.rs"
required-features = ["formats"]

[dev-dependencies]
tempfile = "3"
# For the TLS tests of `pact`'s HTTP client (feature pact-tls): a test CA and a fake https server.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
