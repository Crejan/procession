[package]
name = "p-robe"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Diagnostics of a host as a fixed table of rated verbs, offered to agents as a service that asks before it acts"
license = "MIT OR Apache-2.0"
keywords = ["diagnostics", "agent", "mcp", "approval"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "proposals/**", "SPEC.md"]
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

[features]
# Two verbs that do nothing (`test echo`, rated harmless; `test peak`, rated at
# the top of one scale) so that the service can be tried end to end, and a way
# for the tests to put the audit sink and the lock directory somewhere else.
# Never in a build that is installed on a host: `sys kit` warns when it is.
test-verbs = []

[dependencies]
p-act = { path = "../p-act", version = "0.0.0" }
libc = "0.2"
serde_json = "1"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
