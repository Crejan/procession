# Optional drop-in for probe-serve.service, for a host (or a container with nesting enabled) where
# unit sandboxing works: /etc/systemd/system/probe-serve.service.d/hardening.conf
[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/probe/used
PrivateTmp=true
ProtectHome=true
# NoNewPrivileges must stay off: the service runs the dispatcher through sudo.
NoNewPrivileges=false
