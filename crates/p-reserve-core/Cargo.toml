[package]
name = "p-reserve-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "Library behind p-reserve: named outcomes, freshness, the ledger and the engine seam"
license = "MIT OR Apache-2.0"
keywords = ["backup", "restic", "rustic", "snapshot"]
categories = ["filesystem"]
include = ["src/**"]
publish = false

[features]
# `testing::make_repository`: makes a throwaway repository and writes a snapshot to it. For tests only; nothing
# else in this crate writes to a repository.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
libc = "0.2"
serde_json = "1"

rustic_core = "0.14"
rustic_backend = "0.8"

[dev-dependencies]
tempfile = "3"
