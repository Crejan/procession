[package]
name = "p-reserve"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "Backups of a host or a workstation into a restic-format repository: runs them, keeps them fresh, browses and restores them"
license = "MIT OR Apache-2.0"
keywords = ["backup", "restic", "rustic", "snapshot", "daemon"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**", "SPEC.md"]
publish = false

[[bin]]
name = "preserve"
path = "src/main.rs"

[dependencies]
p-reserve-core = { path = "../p-reserve-core", version = "0.0.0" }
humantime = "2"
thiserror = "2"
p-act = { path = "../p-act", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
p-reserve-core = { path = "../p-reserve-core", version = "0.0.0", features = ["testing"] }
tempfile = "3"
serde_json = "1"
