[package]
name = "p-ledge"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
description = "Holds a person's keys on their own machine: an SSH agent with a rule per program, and the person's end of the approval system"
license = "MIT OR Apache-2.0"
keywords = ["ssh", "ssh-agent", "secure-enclave", "approval", "policy"]
categories = ["command-line-utilities", "authentication"]
include = ["src/**", "testdata/**", "proposals/**", "SPEC.md"]
publish = false

[[bin]]
name = "pledge"
path = "src/main.rs"

[dependencies]
# The formats and ratings of the approval system.
p-act = { path = "../p-act", features = ["pact"] }
# Verifies the host's signature in session-bind@openssh.com and the CA's in a
# host certificate (ed25519, ECDSA P-256/P-384, RSA 2048..8192 with SHA-2),
# and hashes for fingerprints. Already in the workspace's lock file. The
# tests also sign with it.
ring = "0.17"
# known_hosts keys and fingerprints.
base64 = "0.23"
# Records, control messages and state files are JSON lines.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Peer credentials of a socket, flock, isatty, proc_pidpath.
libc = "0.2"
thiserror = "2"
# The connection to the broker: TLS 1.3 with the ring provider, blocking, no runtime (proposals/broker-connection.md).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15", features = ["std"] }

[dev-dependencies]
# The tests of the connection to the broker run against p-age's own code over real TLS (Unix sockets, no TCP).
p-age = { path = "../p-age" }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
